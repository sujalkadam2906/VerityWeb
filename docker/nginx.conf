user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Map upstream proxy protocol to FastCGI HTTPS
    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https on;
    }

    # Map upstream proxy forwarded host or fall back to incoming host
    map $http_x_forwarded_host $fastcgi_host {
        default $http_x_forwarded_host;
        "" $host;
    }

    # Map upstream proxy forwarded port or fall back to protocol default
    map $http_x_forwarded_port $fastcgi_port {
        default $http_x_forwarded_port;
        "" $fastcgi_default_port;
    }

    map $http_x_forwarded_proto $fastcgi_default_port {
        default 80;
        https 443;
    }

    # Include modular server configurations
    include /etc/nginx/http.d/*.conf;
}
