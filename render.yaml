services:
  - type: web
    name: verityweb
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: VerityWeb
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://verityweb.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false # Set in Render dashboard using Supabase Postgres URI
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: true
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: VITE_APP_NAME
        value: VerityWeb
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard using Google AI Studio key
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
